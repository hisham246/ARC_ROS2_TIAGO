teleop_bridge:
  ros__parameters:
    base_link: "base_link"

    # Only enabled devices need to be tracked and are published
    enable_left: false
    enable_right: true
    enable_head: false

    # true: the arm follows the controller's motion from where it is now (latched at start and after tracking dropouts)
    relative_mode: true
    relative_timeout: 0.3
    right_tool_frame: "arm_right_tool_link"
    left_tool_frame: "arm_left_tool_link"

    left_pose_topic:  "/left_arm_cmd"
    right_pose_topic: "/right_arm_cmd"
    head_pose_topic:  "/head_cmd"
    left_grip_topic: "/grip/left"
    right_grip_topic: "/grip/right"

    left_tool_trans: 
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0 #1.5707963
      pitch: 1.5707963
      yaw: 0.0

    right_tool_trans: 
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0 #1.5707963
      pitch: 1.5707963
      yaw: 0.0

    head_tool_trans: 
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

    left_world_trans: 
      x: 0.5
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

    right_world_trans: 
      x: 0.5
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

    head_world_trans: 
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0

    sub_topic: "/xr_input"