IK_control_node:
  ros__parameters:
    frequency: 20.0
    main_group: "full_body"
    root_link: "torso_base_link"
    # right arm only; joints of groups that are not listed are held at their current position
    groups: ["arm_right", "torso"]
    # pose_goals: []
    # joint_goals: []
    center_joints_weight: 0.0
    min_displacement_weight: 0.01
    ik_timeout: 0.02
    # Debug only: false lets the planner publish solutions that the end-state self-collision check would reject
    check_end_state_collision: true
    # false: trajectories carry positions only. The arm/torso controllers reject a last point with non-zero velocity
    send_velocities: false
    default_max_speed: 1.0
    min_displacement_joints: ["torso_lift_joint"]
    min_displacement_joints_weights: [0.1]
    
    arm_left:
      passive_group: false
      position_weight: 2.0
      orient_weight: 1.0
      pose_weight: 0.0
      z_weight: 0.0
      goal_link: "arm_left_tool_link"
      sub_topic: "/left_arm_cmd"
      pub_topic: "/arm_left_controller/joint_trajectory"
    arm_right:
      passive_group: false
      position_weight: 2.0
      orient_weight: 1.0
      pose_weight: 0.0
      z_weight: 0.0
      goal_link: "arm_right_tool_link"
      sub_topic: "/right_arm_cmd"
      pub_topic: "/arm_right_controller/joint_trajectory"
    torso:
      passive_group: true
      # position_weight: 1.0
      # orient_weight: 0.0
      # pose_weight: 0.0
      z_weight: 0.0
      # goal_link: "torso_lift_link"
      # sub_topic: "/head_cmd"
      pub_topic: "/torso_controller/joint_trajectory"
    head:
      passive_group: false
      position_weight: 0.0
      orient_weight: 1.0
      z_weight: 1.0
      pose_weight: 0.0
      goal_link: "head_screen_link"
      sub_topic: "/head_cmd"
      pub_topic: "/head_controller/joint_trajectory"
    