# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    torso_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

right_arm_controller:
  ros__parameters:
    joints:
      - RARM_JOINT0
      - RARM_JOINT1
      - RARM_JOINT2
      - RARM_JOINT3
      - RARM_JOINT4
      - RARM_JOINT5
    command_interfaces:
      [position]
    state_interfaces:
      [position, velocity]
left_arm_controller:
  ros__parameters:
    joints:
      - LARM_JOINT0
      - LARM_JOINT1
      - LARM_JOINT2
      - LARM_JOINT3
      - LARM_JOINT4
      - LARM_JOINT5
    command_interfaces:
      [position]
    state_interfaces:
      [position, velocity]
torso_controller:
  ros__parameters:
    joint: CHEST_JOINT0
    command_interfaces:
      [position]
    state_interfaces:
      [position, velocity]
head_controller:
  ros__parameters:
    joints:
      - HEAD_JOINT0
      - HEAD_JOINT1
    command_interfaces:
      [position]
    state_interfaces:
      [position, velocity]